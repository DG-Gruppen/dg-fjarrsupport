# Bygger DG Fjärrsupport i tre varianter: kundklienten (res/custom-client.json), den
# installerbara teknikerklienten (res/custom-client-tekniker.json) och serverversionen för
# obevakad åtkomst (res/custom-client-server.json, bara Windows). Windows (x64) blir en enda
# exe-fil per variant och Mac (Apple Silicon och Intel) en dmg-fil per variant.
# Stegen är tagna från jobben build-for-windows-flutter och build-for-macOS i
# flutter-build.yml. Mac-versionerna är ännu osignerade och blir bara artefakter.
name: DG Fjärrsupport

# Varje push till grenen bygger artefakter. Är versionen i res/dg-version ny, det vill säga
# taggen v<version> finns inte, publiceras Windows-filerna också som release.
on:
  workflow_dispatch:
  push:
    branches:
      - dg-fjarrsupport
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: write
  # Inloggning i Azure med OIDC för kodsigneringen (Azure Artifact Signing).
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  windows:
    needs: [generate-bridge]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant:
          - {
              name: kund,
              app-exe: dg-fjarrsupport.exe,
              output: DG-Fjarrsupport.exe,
            }
          - {
              name: tekniker,
              app-exe: dg-fjarrsupport-tekniker.exe,
              output: DG-Fjarrsupport-Tekniker.exe,
            }
          - {
              name: server,
              app-exe: dg-fjarrsupport-server.exe,
              output: DG-Fjarrsupport-Server.exe,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Select variant
        shell: bash
        run: |
          variant="${{ matrix.variant.name }}"
          if [ "$variant" != "kund" ]; then
            product="DG Fjärrsupport ${variant^}"
            cp "res/custom-client-$variant.json" res/custom-client.json
            sed -i -e "s/DG Fjärrsupport/$product/g" -e "s/\"dg-fjarrsupport\"/\"dg-fjarrsupport-$variant\"/" -e "s/dg-fjarrsupport\\.exe/${{ matrix.variant.app-exe }}/" flutter/windows/runner/Runner.rc
            sed -i -e "s/DG Fjärrsupport/$product/g" -e "s/DG-Fjarrsupport\\.exe/${{ matrix.variant.output }}/" libs/portable/Cargo.toml
          fi
          grep -n '"app-name"' res/custom-client.json
          grep -n 'ProductName\|OriginalFilename' flutter/windows/runner/Runner.rc libs/portable/Cargo.toml

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: dg-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          mv ./rustdesk/rustdesk.exe ./rustdesk/${{ matrix.variant.app-exe }}

      # Kodsignering med Azure Artifact Signing. Stegen körs bara när repots variabler
      # (Settings → Secrets and variables → Actions → Variables) är satta, se DG-FJARRSUPPORT.md.
      - name: Azure login for signing
        if: ${{ vars.ARTIFACT_SIGNING_ENDPOINT != '' }}
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application files
        if: ${{ vars.ARTIFACT_SIGNING_ENDPOINT != '' }}
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\rustdesk
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/${{ matrix.variant.app-exe }}
          popd
          mkdir -p ./output
          mv ./target/release/rustdesk-portable-packer.exe ./output/${{ matrix.variant.output }}

      - name: Sign self-extracted executable
        if: ${{ vars.ARTIFACT_SIGNING_ENDPOINT != '' }}
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\output\${{ matrix.variant.output }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Checksum
        shell: bash
        run: sha256sum ./output/${{ matrix.variant.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dg-fjarrsupport-${{ matrix.variant.name }}-windows-x64
          path: ./output/${{ matrix.variant.output }}

  release:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < res/dg-version)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag finns redan, publicerar inte."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows builds
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dg-fjarrsupport-*-windows-x64
          path: ./output
          merge-multiple: true

      - name: Publish release
        if: ${{ steps.version.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DG Fjärrsupport ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            DG Fjärrsupport för Windows, byggd från RustDesk 1.5.0 med DG Gruppens inställningar.

            - `DG-Fjarrsupport.exe`: kundklienten. Den installeras inte.
            - `DG-Fjarrsupport-Tekniker.exe`: teknikerklienten. Installeras med knappen i appen, och teknikern loggar in med sitt helpdeskkonto.
            - `DG-Fjarrsupport-Server.exe`: serverversionen för obevakad åtkomst. Installeras som tjänst, till exempel med `--silent-install`, och får sitt lösenord med `--password`.

            Källkoden för den här versionen finns i taggen ${{ steps.version.outputs.tag }}.
          files: ./output/*.exe

  macos:
    needs: [generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - {
              name: kund,
              app-name: DG-Fjarrsupport,
              product: "DG Fjärrsupport",
              bundle-id: se.dggruppen.fjarrsupport,
              scheme: dg-fjarrsupport,
              dmg-args: "",
            }
          - {
              name: tekniker,
              app-name: DG-Fjarrsupport-Tekniker,
              product: "DG Fjärrsupport Tekniker",
              bundle-id: se.dggruppen.fjarrsupport-tekniker,
              scheme: dg-fjarrsupport-tekniker,
              dmg-args: "--app-drop-link 400 170",
            }
        job:
          # macos-14 fick ingen ledig maskin 2026-10-21 ("not acquired by Runner"); macos-15 är också arm64.
          - {
              target: aarch64-apple-darwin,
              os: macos-15,
              arch: arm64,
              extra-build-args: "--screencapturekit",
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              arch: x64,
              extra-build-args: "",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Select variant
        run: |
          if [ "${{ matrix.variant.name }}" = "tekniker" ]; then
            cp res/custom-client-tekniker.json res/custom-client.json
          fi
          grep -n '"app-name"' res/custom-client.json

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # aom and other multimedia libraries require NASM 2.x, not 3.x from brew.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: dg-${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      # Appen döps efter appnamnet i res/custom-client.json och får eget bundle-id och
      # URL-schema (appnamnet med gemener, som RustDesk använder). Den signeras ad hoc, eftersom
      # ändringen i Info.plist bryter Xcodes signatur. Riktig signering kräver Developer ID.
      - name: Brand app bundle
        run: |
          mkdir -p ./output
          app="./output/${{ matrix.variant.app-name }}.app"
          plist="$app/Contents/Info.plist"
          ditto ./flutter/build/macos/Build/Products/Release/RustDesk.app "$app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${{ matrix.variant.product }}" "$plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${{ matrix.variant.product }}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${{ matrix.variant.bundle-id }}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName ${{ matrix.variant.bundle-id }}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 ${{ matrix.variant.scheme }}" "$plist"
          codesign --force --deep --sign - --entitlements ./flutter/macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Create dmg
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          dmg="./output/${{ matrix.variant.app-name }}-macos-${{ matrix.job.arch }}.dmg"
          create-dmg --volname "${{ matrix.variant.product }}" --window-size 540 360 --icon "${{ matrix.variant.app-name }}.app" 140 170 --hide-extension "${{ matrix.variant.app-name }}.app" ${{ matrix.variant.dmg-args }} "$dmg" "./output/${{ matrix.variant.app-name }}.app"
          shasum -a 256 "$dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dg-fjarrsupport-${{ matrix.variant.name }}-macos-${{ matrix.job.arch }}
          path: ./output/${{ matrix.variant.app-name }}-macos-${{ matrix.job.arch }}.dmg
